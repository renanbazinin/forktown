name: Publish town

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tested:
        description: Only build, because check already passed on this exact main commit (Auto-merge sets this)
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure this repository’s public URL
        run: node scripts/configure-pages.mjs
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          PAGES_SITE_URL: ${{ vars.PAGES_SITE_URL }}
      - run: npm ci
      # Auto-merge sets tested once it has seen check pass on the head it merged, up to date with
      # main, so that run only builds. Pushes, and runs by hand without it, test first.
      - if: github.event_name != 'workflow_dispatch' || inputs.tested != 'true'
        run: npm run check
      - if: github.event_name == 'workflow_dispatch' && inputs.tested == 'true'
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the town
        id: deployment
        uses: actions/deploy-pages@v5
