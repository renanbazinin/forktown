name: Full town

# The whole test suite with a made-up house on every free plot, so a change to the town's code
# can't turn npm run check red for the neighbors still to come.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-town-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-town:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test the town with every house plot taken
        run: npm run check:full-town
