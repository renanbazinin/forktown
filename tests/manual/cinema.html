<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forktown · Starlight Cinema</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #152a2b;
        color: #ece2c5;
        font: 14px system-ui;
      }
      main {
        max-width: 1280px;
        margin: auto;
        padding: 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 18px;
      }
      h1 {
        font: 36px Georgia;
        margin: 6px 0;
      }
      p {
        color: #b5c4b6;
        line-height: 1.5;
        margin: 8px 0;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 3px;
        color: #d5b778;
      }
      button {
        font: inherit;
        color: #eee3c3;
        background: #2d4845;
        border: 1px solid #506b5b;
        border-radius: 7px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:hover,
      button.active {
        background: #577660;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
      }
      .options {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
        font-size: 12px;
        color: #becbbf;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
        background: #233d37;
        margin: 16px 0;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #d8bc7a;
      }
      .bill {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .film {
        flex: 1;
        min-width: 190px;
        padding: 14px 18px;
        border: 1px solid #425b50;
        border-radius: 8px;
      }
      .film strong {
        display: block;
        margin: 4px 0;
      }
      .film span {
        color: #b8c5b5;
        font-size: 12px;
      }
      #status {
        font-size: 13px;
        color: #dfc99a;
      }
      a {
        color: #e3cf9d;
      }
      @media (max-width: 600px) {
        main {
          padding: 14px;
        }
        header {
          display: block;
        }
        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">FORKTOWN PICTURE HOUSE</span>
          <h1>The Starlight Cinema</h1>
          <p>Three little stories. A blanket on the lawn. A night under the stars.</p>
        </div>
        <a href="/#venue=cinema">Visit the live town →</a>
      </header>
      <div class="bill" id="bill"></div>
      <p><a href="/tests/manual/cinema-films.html">Preview every film →</a></p>
      <nav id="films"></nav>
      <div class="options">
        <button id="play">Pause</button
        ><button id="sound" aria-pressed="false">Turn sound on</button
        ><button id="tonight">Watch tonight from the start</button
        ><button id="interval">Cinema break</button><button id="raise">Raise screen</button
        ><button id="lower">Lower screen</button><button id="daylight">Daytime venue</button
        ><label><input type="checkbox" id="close" /> Closer to the screen</label
        ><label><input type="checkbox" id="crowd" checked /> Preview audience</label>
      </div>
      <p id="status" role="status"></p>
      <input type="range" id="time" aria-label="Screening progress" step="0.05" />
      <canvas width="1200" height="740" aria-label="Outdoor cinema preview"></canvas>
      <p>
        This preview uses the real films, venue, and town clock logic. The optional preview audience
        does not change the live town.
      </p>
      <script type="module">
        import { renderCity } from '/src/city/render.ts';
        import {
          cinemaProgram,
          cinemaAt,
          cinemaListening,
          CINEMA_FRAME,
          CINEMA_SCREEN_RISE,
          CINEMA_SCREEN_ROLL_SECONDS,
        } from '/src/lib/cinema.ts';
        import { SCREEN_ORIGIN, SCREEN_SCALE } from '/src/city/cinema.ts';
        import { TownPlayer } from '/src/music/player.ts';
        import { eventsForDay, HOUSE_PLOTS } from '/src/lib/events.ts';
        import { places } from '/src/lib/places.ts';
        import { simulateResidents, timeLabel } from '/src/lib/simulation.ts';
        const canvas = document.querySelector('canvas'),
          ctx = canvas.getContext('2d'),
          slider = document.querySelector('#time');
        // Any night's bill: ?day=12 previews a different mix of films and ads.
        const day = Number(new URLSearchParams(location.search).get('day') ?? 0),
          bill = cinemaProgram(day);
        const previewHomes = HOUSE_PLOTS.slice(0, 32).map((plot, index) => ({
          ...places[index % places.length],
          id: `cinema-preview-${index}`,
          plot: plot.id,
          resident: {
            ...places[index % places.length].resident,
            routine: { morning: 'home', afternoon: 'home', evening: 'stroll', night: 'stroll' },
          },
        }));
        let time = bill.start,
          playing = !matchMedia('(prefers-reduced-motion: reduce)').matches,
          last = 0;
        let player,
          soundEnabled = false;
        slider.min = CINEMA_SCREEN_RISE;
        slider.max = bill.end + CINEMA_SCREEN_ROLL_SECONDS;
        for (const [index, slot] of bill.slots.filter((slot) => slot.film || slot.ad).entries()) {
          const item = slot.film ?? slot.ad;
          const card = document.createElement('div');
          card.className = 'film';
          const duration = document.createElement('span');
          duration.textContent = slot.film
            ? [slot.film.genre?.toUpperCase(), `${item.duration} SECONDS`, slot.film.rating]
                .filter(Boolean)
                .join(' · ')
            : `AD · ${item.duration} SECONDS`;
          const name = document.createElement('strong');
          name.textContent = slot.film?.title ?? slot.ad.sponsor;
          const description = document.createElement('span');
          description.textContent = slot.film?.description ?? slot.ad.tagline;
          card.append(duration, name, description);
          document.querySelector('#bill').append(card);
          const button = document.createElement('button');
          button.textContent = slot.film?.title ?? `Ad: ${slot.ad.sponsor}`;
          button.onclick = () => {
            time = slot.start;
            playing = true;
            paint();
          };
          document.querySelector('#films').append(button);
        }
        function paint() {
          const state = cinemaAt(time, day),
            close = document.querySelector('#close').checked,
            full = document.querySelector('#crowd').checked;
          const center = close
            ? {
                x: SCREEN_ORIGIN.x + 160 * SCREEN_SCALE,
                y: SCREEN_ORIGIN.y - 150 + 170 * SCREEN_SCALE,
              }
            : CINEMA_FRAME.center;
          const zoom = close ? 3.3 : 1.5;
          const camera = { x: 600 - center.x * zoom, y: 350 - center.y * zoom, zoom };
          const film = state.slot?.film ?? state.slot?.ad;
          player?.cinemaSound(
            soundEnabled && playing && !document.hidden && film
              ? {
                  film,
                  elapsed: state.elapsed,
                  key: `${day}:${state.slot.start}:${film.id}`,
                  ...cinemaListening(camera, 1200, 740),
                }
              : undefined,
          );
          const homes = full ? previewHomes : places;
          renderCity({
            ctx,
            width: 1200,
            height: 740,
            camera,
            places,
            residents: simulateResidents(homes, time % 1440, day + Math.floor(time / 1440)),
            events: eventsForDay(day + Math.floor(time / 1440), time % 1440),
            minutes: time,
            day,
            night: time % 1440 >= 1200 || time % 1440 < 360,
            selectedPlot: null,
            hoveredPlot: null,
            showPlots: false,
          });
          document.querySelector('#status').textContent =
            `${timeLabel(time)} · ${state.slot?.film?.title ?? (state.slot?.ad ? `Ad · ${state.slot.ad.sponsor}` : state.slot ? (state.slot.kind === 'closing' ? 'Goodnight, Forktown' : 'Starlight Cinema · a little breather') : 'The lawn is ready for tonight')} · ${Math.floor(state.elapsed)}s`;
          document.querySelector('#play').textContent = playing ? 'Pause' : 'Play';
          slider.value = time;
        }
        document.querySelector('#play').onclick = () => {
          playing = !playing;
          paint();
        };
        document.querySelector('#sound').onclick = async () => {
          const button = document.querySelector('#sound');
          try {
            player ??= new TownPlayer();
            if (!soundEnabled) await player.resume();
            soundEnabled = !soundEnabled;
            button.textContent = soundEnabled ? 'Mute' : 'Turn sound on';
            button.setAttribute('aria-pressed', String(soundEnabled));
            paint();
          } catch {
            button.textContent = 'Retry sound';
          }
        };
        document.querySelector('#tonight').onclick = () => {
          time = bill.start;
          playing = true;
          paint();
        };
        document.querySelector('#interval').onclick = () => {
          // One-film nights have no intermission; their break is the opening card.
          time = (
            bill.slots.find((slot) => slot.kind === 'interval') ??
            bill.slots.find((slot) => slot.kind === 'opening')
          ).start;
          playing = false;
          paint();
        };
        document.querySelector('#daylight').onclick = () => {
          time = 720;
          playing = false;
          paint();
        };
        document.querySelector('#raise').onclick = () => {
          time = CINEMA_SCREEN_RISE;
          playing = true;
          paint();
        };
        document.querySelector('#lower').onclick = () => {
          time = bill.end;
          playing = true;
          paint();
        };
        document.querySelector('#close').onchange = paint;
        document.querySelector('#crowd').onchange = paint;
        slider.oninput = () => {
          time = Number(slider.value);
          playing = false;
          paint();
        };
        function tick(now) {
          if (playing && !document.hidden) {
            time += (now - last) / 1000;
            if (time >= bill.end + CINEMA_SCREEN_ROLL_SECONDS + 3) time = CINEMA_SCREEN_RISE;
            paint();
          }
          last = now;
          requestAnimationFrame(tick);
        }
        document.addEventListener('visibilitychange', paint);
        window.addEventListener('pagehide', () => player?.dispose());
        paint();
        requestAnimationFrame(tick);
      </script>
    </main>
  </body>
</html>
