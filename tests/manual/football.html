<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Meadow Ground · Match preview</title>
    <style>
      body {
        margin: 0;
        background: #f4f2e7;
        color: #34523e;
        font: 14px system-ui;
      }
      header {
        padding: 18px 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      h1 {
        font: 28px Georgia;
        margin: 0 16px 0 0;
      }
      button,
      input {
        accent-color: #426e50;
      }
      button {
        padding: 9px 13px;
        border: 1px solid #c5ceb5;
        border-radius: 6px;
        color: inherit;
        background: #fffdf6;
        cursor: pointer;
      }
      canvas {
        display: block;
        width: 100%;
        height: calc(100dvh - 175px);
        background: #dde5ce;
      }
      footer {
        padding: 12px 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
      }
      #caption {
        min-width: 250px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>The Meadow Ground</h1>
      <button id="play">Pause match</button><button id="sound">Turn sound on</button
      ><button id="new">Next match</button><button id="night">Night view</button
      ><label>Zoom <input id="zoom" type="range" min="0.3" max="2" step="0.05" value="1.1" /></label
      ><a href="/">Back to town</a>
    </header>
    <canvas aria-label="Live four-a-side football preview"></canvas>
    <footer>
      <strong id="score"></strong><span id="caption" role="status"></span
      ><label
        >Match time
        <input
          id="time"
          aria-label="Match time"
          type="range"
          min="0"
          max="139.99"
          step="0.01"
          value="0" /></label
      ><small>Preview uses the real match, crowd, and sound. One second = one town minute.</small>
    </footer>
    <script type="module">
      import { renderCity } from '/src/city/render.ts';
      import { footballAt, footballListening, FOOTBALL_CENTER } from '/src/lib/football.ts';
      import { footballSoundsBetween } from '/src/music/football-sound.ts';
      import { TownPlayer } from '/src/music/player.ts';
      import { places } from '/src/lib/places.ts';
      import { simulateResidents } from '/src/lib/simulation.ts';
      import { eventsForDay } from '/src/lib/events.ts';
      import { project } from '/src/lib/world.ts';
      let minutes = 500,
        day = 0,
        running = !matchMedia('(prefers-reduced-motion: reduce)').matches,
        last = performance.now(),
        previous = null,
        audio = null,
        enabled = false;
      const canvas = document.querySelector('canvas'),
        play = document.querySelector('#play'),
        sound = document.querySelector('#sound');
      play.textContent = running ? 'Pause match' : 'Play match';
      play.onclick = () => {
        running = !running;
        play.textContent = running ? 'Pause match' : 'Play match';
        previous = null;
        audio?.silenceEffects();
      };
      sound.onclick = async () => {
        audio ??= new TownPlayer();
        await audio.resume();
        enabled = !enabled;
        if (!enabled) audio.silenceEffects();
        previous = null;
        sound.textContent = enabled ? 'Mute sound' : 'Turn sound on';
      };
      document.querySelector('#new').onclick = () => {
        day++;
        minutes = 500;
        previous = null;
      };
      document.querySelector('#night').onclick = () => {
        minutes = minutes >= 1200 ? 500 : 1260;
        previous = null;
      };
      document.querySelector('#time').oninput = (event) => {
        minutes = 500 + Number(event.target.value);
        previous = null;
        audio?.silenceEffects();
      };
      document.addEventListener('visibilitychange', () => {
        previous = null;
        if (document.hidden) audio?.suspend();
        else if (enabled) audio?.resume();
      });
      function paint(now) {
        const delta = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (running && !document.hidden) minutes += delta;
        const game = footballAt(minutes, day),
          width = canvas.clientWidth,
          height = canvas.clientHeight,
          ratio = Math.min(devicePixelRatio, 2);
        if (
          canvas.width !== Math.floor(width * ratio) ||
          canvas.height !== Math.floor(height * ratio)
        ) {
          canvas.width = width * ratio;
          canvas.height = height * ratio;
        }
        const ctx = canvas.getContext('2d');
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        const center = project(FOOTBALL_CENTER.x, FOOTBALL_CENTER.y),
          zoom = Number(document.querySelector('#zoom').value),
          camera = { x: width / 2 - center.x * zoom, y: height / 2 - center.y * zoom, zoom };
        renderCity({
          ctx,
          width,
          height,
          camera,
          places,
          residents: simulateResidents(places, minutes, day),
          events: eventsForDay(day),
          minutes,
          football: game,
          night: minutes >= 1200,
          selectedPlot: 'F4',
          hoveredPlot: null,
          showPlots: false,
        });
        const listening = footballListening(camera, width, height);
        if (enabled && running && !document.hidden && listening.gain > 0)
          for (const effect of footballSoundsBetween(previous, game))
            audio.effect(effect.kind, effect.strength * listening.gain, listening.pan);
        previous = enabled && running && !document.hidden && listening.gain > 0 ? game : null;
        document.querySelector('#score').textContent =
          `Meadow ${game.score[0]} : ${game.score[1]} Sunset · ${game.clock}`;
        document.querySelector('#caption').textContent = game.caption;
        document.querySelector('#time').value = game.elapsed;
        requestAnimationFrame(paint);
      }
      requestAnimationFrame(paint);
    </script>
  </body>
</html>
