<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forktown · Moon Harvest Farm preview</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #eaf0df;
        color: #304d40;
        font: 15px system-ui;
      }
      h1 {
        font: 32px Georgia;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0;
      }
      button {
        padding: 10px 16px;
        border: 1px solid #8caa91;
        border-radius: 6px;
        background: #fffbed;
        color: #304d40;
        cursor: pointer;
      }
      canvas {
        width: 100%;
        height: auto;
        border-radius: 12px;
      }
      input {
        width: 100%;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Moon Harvest Farm</h1>
    <nav>
      <button id="day">Daytime</button><button id="night">Nighttime</button>
      <button id="ufo">UFO visit</button><button id="hop">Scarecrow hop</button>
      <button id="next-ufo">Next UFO house</button>
      <button id="next">Next night</button><button id="live">Live UTC</button>
      <button id="pause">Pause / resume</button>
      <a href="/#venue=farm">Open farm in town</a>
    </nav>
    <p id="status"></p>
    <input
      id="time"
      aria-label="Town minute"
      type="range"
      min="0"
      max="1439"
      step="0.1"
      value="720"
    />
    <canvas id="map" width="1440" height="900"></canvas>
    <script type="module">
      import { renderCity } from '/src/city/render.ts';
      import { FARM_FRAME, scarecrowAt, ufoAt } from '/src/lib/farm.ts';
      import { townDayAt, townMinutesAt } from '/src/lib/town-time.ts';
      import { timeLabel } from '/src/lib/simulation.ts';
      import { places } from '/src/lib/places.ts';
      import { getPlot, plotCenter } from '/src/lib/world.ts';
      const canvas = document.querySelector('#map'),
        ctx = canvas.getContext('2d');
      const slider = document.querySelector('#time');
      let day = 0,
        minutes = 720,
        playing = false,
        houseView = false,
        live = false,
        last = performance.now();
      function set(value, animate = false) {
        minutes = value;
        playing = animate;
        live = false;
      }
      document.querySelector('#day').onclick = () => {
        houseView = false;
        set(720);
      };
      document.querySelector('#night').onclick = () => {
        houseView = false;
        set(240);
      };
      document.querySelector('#ufo').onclick = () => {
        day = 0;
        houseView = true;
        set(90, true);
      };
      document.querySelector('#next-ufo').onclick = () => {
        day = (Math.floor(day / 10) + 1) * 10;
        houseView = true;
        set(120);
      };
      document.querySelector('#hop').onclick = () => {
        houseView = false;
        set(58, true);
      };
      document.querySelector('#next').onclick = () => {
        day++;
        houseView = false;
        set(58, true);
      };
      document.querySelector('#live').onclick = () => {
        live = true;
        playing = true;
      };
      document.querySelector('#pause').onclick = () => {
        playing = !playing;
      };
      slider.oninput = () => set(Number(slider.value));
      function tick(now) {
        if (playing) {
          if (live) {
            const utc = Date.now();
            day = townDayAt(utc);
            minutes = townMinutesAt(utc);
          } else {
            minutes += (now - last) / 1000;
            if (minutes >= 1440) {
              minutes %= 1440;
              day++;
            }
          }
        }
        last = now;
        const night = minutes < 360 || minutes >= 1200;
        canvas.style.background = night ? '#263D40' : '#DAE4CD';
        const ufo = ufoAt(minutes, day, places);
        const target = ufoAt(120, Math.floor(day / 10) * 10, places);
        const center =
          houseView && target ? plotCenter(getPlot(target.targetPlot)) : FARM_FRAME.center;
        const zoom = houseView ? 2 : 1.03;
        renderCity({
          ctx,
          width: canvas.width,
          height: canvas.height,
          camera: {
            x: canvas.width / 2 - center.x * zoom,
            y: canvas.height / 2 - (center.y - (houseView ? 90 : 60)) * zoom,
            zoom,
          },
          places,
          selectedPlot: houseView ? null : 'S9',
          hoveredPlot: null,
          night,
          showPlots: false,
          minutes,
          day,
        });
        slider.value = minutes;
        const crow = scarecrowAt(minutes, day);
        document.querySelector('#status').textContent =
          `Town day ${day} · ${timeLabel(minutes)} · Scarecrow ${crow.hopping ? 'hopping to ' + crow.destination : 'at ' + crow.plot} · UFO ${ufo ? 'above ' + ufo.targetPlot + ' (' + ufo.targetId + ')' : 'away'}${live ? ' · Live UTC' : ''}`;
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
